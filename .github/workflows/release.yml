# Publie une version : pousser un tag « vX.Y.Z » (même numéro que package.json).
# Construit l'installeur Windows (NSIS) et les paquets Linux (AppImage, .deb), les signe pour
# les mises à jour automatiques et joint latest.json à la Release, que l'app consulte.
#
# Secrets du dépôt à créer (Settings → Secrets and variables → Actions) :
#   TAURI_SIGNING_PRIVATE_KEY           contenu de ~/.tauri/dislite.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  vide si la clé n'a pas de mot de passe
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libopus-dev libasound2-dev patchelf file

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Dislite v__VERSION__
          releaseDraft: true
          includeUpdaterJson: true
          # Les artefacts de mise à jour (signés) ne sont produits qu'ici : une build locale
          # n'a pas besoin de la clé privée.
          args: --config {"bundle":{"createUpdaterArtifacts":true}}
